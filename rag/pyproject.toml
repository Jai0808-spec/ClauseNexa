[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "clausenexa-rag"
version = "0.1.0"
description = "RAG pipeline for ClauseNexa"
requires-python = ">=3.10"

dependencies = [
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "sentence-transformers>=3.0.0"
]


[tool.setuptools.packages.find]
where = ["src"]